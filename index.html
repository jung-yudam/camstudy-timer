<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>캠스터디 50/10 뽀모도로 타이머</title>
  <style>
    :root {
      --bg-day: #111827;
      --bg-evening: #161529;
      --bg-night: #0d1021;
      --bg-meal: #261b0c;
      --bg-finish: #11221e;
      --card-bg: rgba(255, 255, 255, 0.06);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-study: #38bdf8;
      --accent-break: #34d399;
      --accent-night: #a78bfa;
      --accent-meal: #fbbf24;
      --accent-finish: #2dd4bf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-day);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px 18px;
      transition: background-color 0.6s ease;
      overflow-x: hidden;
    }

    .main-layout {
      width: 100%;
      max-width: 1020px;
      margin: auto;
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 22px;
      align-items: start;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .timer-card {
      text-align: center;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .current-clock {
      font-size: 1rem;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .sky-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .sky-icon {
      font-size: 1.25rem;
      line-height: 1;
    }

    /* 점심 / 저녁 / 23시 종료 강조 메시지 */
    .banner-box {
      display: none;
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 18px;
      border: 1px solid rgba(251, 191, 36, 0.35);
      background: rgba(251, 191, 36, 0.14);
    }

    .banner-box.show {
      display: block;
    }

    .banner-box.finish-banner {
      border-color: rgba(45, 212, 191, 0.4);
      background: rgba(45, 212, 191, 0.14);
    }

    .banner-title {
      font-size: 1.45rem;
      font-weight: 800;
      margin-bottom: 4px;
      color: var(--accent-meal);
    }

    .banner-box.finish-banner .banner-title {
      color: var(--accent-finish);
    }

    .banner-sub {
      font-size: 0.92rem;
      color: var(--text-main);
      opacity: 0.9;
    }

    .status-badge {
      display: inline-block;
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 1.02rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent-study);
      transition: all 0.3s ease;
    }

    .session-info {
      font-size: 1.04rem;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    /* 큰 시계 표시 영역 */
    .timer-display {
      font-size: clamp(4.8rem, 11vw, 7.6rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -3px;
      line-height: 1.02;
      margin: 10px 0 24px;
      padding: 10px 4px;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    }

    /* 휴식 시간 안내 문구 박스 (매시 50~60분 자동 노출) */
    .break-tip-box {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(52, 211, 153, 0.13);
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.96rem;
      font-weight: 600;
      color: #a7f3d0;
      animation: fadeTip 0.4s ease;
    }

    .break-tip-box.show {
      display: flex;
    }

    .break-tip-icon {
      font-size: 1.3rem;
      line-height: 1;
    }

    @keyframes fadeTip {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .progress-wrap {
      width: 100%;
      height: 11px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 2
